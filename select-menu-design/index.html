<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Select Menu Design</title>
  </head>
  <body>
    <div class="hero">
      <div class="selector">
        <div id="selectField" onclick="showList()">
          <p id="selectText">Select social media</p>
          <img src="./SelectMenu_Img/arrow.png" alt="" id="rotate" />
        </div>
        <ul id="list" class="active">
          <li class="options">
            <img src="./SelectMenu_Img/facebook.png" alt="" />
            <p>Facebook</p>
          </li>

          <li class="options">
            <img src="./SelectMenu_Img/instagram.png" alt="" />
            <p>Instagram</p>
          </li>
          <li class="options">
            <img src="./SelectMenu_Img/pinterest.png" alt="" />
            <p>Pinterest</p>
          </li>
          <li class="options">
            <img src="./SelectMenu_Img/youtube.png" alt="" />
            <p>Youtube</p>
          </li>
          <li class="options">
            <img src="./SelectMenu_Img/whatsapp.png" alt="" />
            <p>Whatsapp</p>
          </li>
          <li class="options">
            <img src="./SelectMenu_Img/twitter.png" alt="" />
            <p>Twitter</p>
          </li>
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
